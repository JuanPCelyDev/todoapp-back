spring:
  application:
    name: todo-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/todoapp_db}
    username: ${SPRING_DATASOURCE_USERNAME:todoapp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:todoapp_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/todoapp_db}
    user: ${SPRING_DATASOURCE_USERNAME:todoapp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:todoapp_pass}

jwt:
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz123456}
  expiration: ${JWT_EXPIRATION:86400000}
server:
  port: ${PORT:8080}
