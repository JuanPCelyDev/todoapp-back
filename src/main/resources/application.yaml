spring:
  application:
    name: todo-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/todoapp_db}
    username: ${DB_USERNAME:todoapp_user}
    password: ${DB_PASSWORD:todoapp_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5433/todoapp_db
    user: todoapp_user
    password: todoapp_pass

jwt:
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz123456}
  expiration: ${JWT_EXPIRATION:86400000}
server:
  port: ${PORT:8080}
