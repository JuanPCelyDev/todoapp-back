services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: todoapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todoapp_db
      POSTGRES_PASSWORD: todoapp_pass
      POSTGRES_USER: todoapp_user
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: